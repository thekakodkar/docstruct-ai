[build-system]
requires = ["hatchling>=1.24.2,<1.27"]
build-backend = "hatchling.build"

[project]
name = "docstruct-ai"
version = "1.0.0"
description = "Model-agnostic OCR & structured XML/JSON extraction library. Open-weight SLMs, cloud VLMs, deterministic Pydantic/XSD schema enforcement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Niraj Kakodkar" }
]
keywords = [
    "ocr",
    "document-ai",
    "vlm",
    "structured-extraction",
    "pydantic",
    "xml",
    "json",
    "pdf",
    "docx",
    "markdown",
    "s3",
    "invoice",
    "schema",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "Pillow>=10.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
]
office = [
    # DOCX/PPTX text extraction uses the stdlib; these are optional richer parsers
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
xml = [
    "lxml>=5.0",
]
s3 = [
    "boto3>=1.34",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
playground = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-Pillow",
]
all = [
    "docstruct-ai[pdf,office,xml,s3,cli,playground,dev]",
]

[project.urls]
Homepage = "https://github.com/thekakodkar/docstruct-ai"
Documentation = "https://thekakodkar.github.io/docstruct-ai/"
Repository = "https://github.com/thekakodkar/docstruct-ai"
Issues = "https://github.com/thekakodkar/docstruct-ai/issues"

[project.scripts]
docstruct = "docstruct.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docstruct"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["docstruct"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
